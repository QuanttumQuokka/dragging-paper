<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Drag Papers ❤️</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zeyada&display=swap">
</head>
<body>

<!-- Heart / Cute Circle -->
<div class="paper heart"></div>

<!-- IMAGE 1 -->
<div class="paper image">
  <p>You are my</p>
  <p>favorite person ❤️</p>
  <img src="images/1.jpeg" />
</div>

<!-- IMAGE 2 -->
<div class="paper image">
  <p>Just look at</p>
  <p>this cuteness 😍</p>
  <img src="images/3.jpeg" />
</div>

<!-- IMAGE 3 -->
<div class="paper image">
  <p>That smile...</p>
  <p>killing me 😩💕</p>
  <img src="images/2.jpeg" />
</div>

<!-- IMAGE 4 -->
<div class="paper image">
  <p>You're</p>
  <p>beautiful 💗</p>
  <img src="images/6.jpeg" />
</div>

<!-- IMAGE 5 -->
<div class="paper image">
  <p>I adore</p>
  <p>you 😘</p>
  <img src="images/4.jpeg" />
</div>

<!-- IMAGE 6 -->
<div class="paper image">
  <p>Always keep</p>
  <p>smiling 😍✨</p>
  <img src="images/5.jpeg" />
</div>

<!-- Text Sheet -->
<div class="paper red">
  <p class="p1">You make</p>
  <p class="p2">my world better ❤️</p>
</div>

<!-- Drag Hint -->
<div class="paper">
  <p class="p1">Drag the papers to move!</p>
</div>

<script src="paper.js"></script>
<script src="script.js"></script>
</body>
</html>
